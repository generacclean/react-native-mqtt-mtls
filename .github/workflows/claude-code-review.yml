name: Claude Code Review (Manual)

# Triggered manually via @claude mention in PR comments or claude-code label.
# Based on installer-app implementation with multiple trigger methods.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-manual-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.actor != 'claude[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'claude-code'
        ||
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude')
        ||
        github.event_name == 'pull_request_review' &&
        github.event.review.body != '' &&
        contains(github.event.review.body, '@claude')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017820692424:role/GitHubClaudeBedrockRoleGeneracClean
          aws-region: us-east-1
          role-session-name: GitHubClaudeSession

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: true
          track_progress: true
          trigger_phrase: "@claude"
          prompt: |
            Perform a comprehensive code review on code changes in this pull request for the react-native-mqtt-mtls library with focus on:

            1. **Correctness & bugs** - Edge cases, null handling, memory leaks, native resource cleanup, threading issues, callback double-invocation
            2. **Binary detection** - Topic-based patterns, UTF-8 fallback, protobuf classification, Uint8Array handling
            3. **Native module patterns** - iOS/Android bridge patterns, promise/callback handling with guards (safeInvoke/CallbackGuard), error propagation
            4. **Security** - Certificate validation, key protection (KeyStore/Keychain), TLS config, credential leaks, mTLS handshake
            5. **TypeScript types** - Type definitions accuracy (Uint8Array not ArrayBuffer), unsafe casts
            6. **Testing** - Adequate coverage for new logic, binary detection edge cases
            7. **Documentation** - API changes in README, CHANGELOG updated

            Critical patterns to check:
            - Callback guards: Android uses safeInvoke(callback, AtomicBoolean), iOS uses CallbackGuard wrapper
            - Binary detection: Topic patterns FIRST (deterministic), UTF-8 heuristic FALLBACK only
            - Connect callbacks: iOS must use shared settled guard for mutual exclusion

            Rate each issue from 0-100:
            0-25: Likely false positive
            26-50: Minor nitpick
            51-75: Valid but low-impact
            76-90: Important issue requiring attention
            91-100: Critical bug (callback crash, binary misclassification, mTLS failure, memory leak)

            Only report issues with confidence more than 80% and rate over 75.

            Summary should include: overview of changes, list of issues found (with severity), and an overall assessment.
            If you find no issues which satisfy passing criteria, post in summary NO ISSUES FOUND.

            Provide detailed feedback using inline comments for specific issues.
            Do not duplicate unaddressed inline comments. If inline comment marked as resolved, skip it.
            On re-reviews, skip already-addressed issues and focus inline comments on newly introduced code.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Use `gh pr comment` for top-level summary feedback.
            Only post GitHub comments — don't submit review text as messages.
          claude_args: |
            --model us.anthropic.claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),mcp__github__create_inline_comment,mcp__github__create_comment"
